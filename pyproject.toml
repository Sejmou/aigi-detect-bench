[project]
name = "aigi-bench"
version = "0.1.0"
description = "Starter benchmark harness for AI-generated image detection: robustness curves, calibration, and pluggable detectors"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "open-clip-torch>=2.24",
    "numpy>=1.26",
    "pillow>=10.0",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "timm>=0.9",
]

[project.optional-dependencies]
# Reconstruction-based detectors (DIRE / FIRE style) need diffusers.
recon = ["diffusers>=0.27", "transformers>=4.40", "accelerate>=0.29"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
aigi-bench = "aigi_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aigi_bench"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
